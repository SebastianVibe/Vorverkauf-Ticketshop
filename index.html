<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe Ticketshop – Dauerkarte Saison 2027 / 2028</title>
<style>
:root{
  /* Farbwerte aus dem dunklen Ticketshop Energie Cottbus */
  --yellow:#fdcc06;
  --accent:#d93930;
  --green:#3b873d;
  --text-primary:#fff;
  --text-secondary:#fafafa;
  --text-tertiary:#a1a1a1;
  --border:#3d3d3d;
  --border-secondary:#4a4a4a;
  --bg-elevated:#1f1f1f;
  --bg-fill:#000;
  --bg-label:#595959;
  --bg-darklabel:#000;
  --neutrals-5:#595959;
  --r-md:6px;
  --r-lg:8px;
  --shadow:0 12px 42px -4px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg-elevated);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
.ic{display:block}

/* ============ Layout ============ */
.app{display:flex;height:100vh;width:100vw;background:var(--bg-elevated)}
.panel{width:555px;flex:none;display:flex;flex-direction:column;background:var(--bg-elevated);overflow-y:auto;overscroll-behavior:contain}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:#4a4a4a;border-radius:3px}
.slider{width:16px;flex:none;background:#000;display:flex;justify-content:center;align-items:center;cursor:col-resize;user-select:none;touch-action:none}
.slider i{width:4px;height:50px;border-radius:2px;background:#d9d9d9}
.slider:hover i,.slider.drag i{background:#b5b5b5}
.map{flex:1;background:var(--bg-label);border-left:1px solid var(--border-secondary);position:relative;overflow:hidden}
body.mobile .app{flex-direction:column}
body.mobile .panel{width:100%;flex:1}
body.mobile .map{flex:none;height:42vh;border-left:0;border-bottom:1px solid var(--border-secondary)}
body.mobile .slider{width:100%;height:16px;cursor:row-resize}
body.mobile .slider i{width:60px;height:4px;border-radius:2px}

/* ============ Map ============ */
.zoom{position:absolute;right:30px;top:30px;width:43px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom button{width:43px;height:43px;color:var(--text-primary);background:var(--bg-elevated);border:1px solid var(--border-secondary);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.canvas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mapshot{position:relative;width:905px;height:750px;transition:transform .25s ease}
.mapshot img{position:absolute;left:-38.96%;top:0;width:138.96%;height:100%;max-width:none}
.mapshot .ph{width:100%;height:100%;background:repeating-linear-gradient(45deg,#e9e9ec 0 14px,#e3e3e7 14px 28px)}
.mapshot .mapsvg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.mapshot.locked{filter:grayscale(1) opacity(.45)}
.tooltip{position:absolute;left:208px;top:531px;width:69px;height:36px;display:flex;align-items:flex-end;justify-content:center}
.tooltip span{background:var(--bg-darklabel);border:1px solid var(--bg-darklabel);border-radius:var(--r-md);padding:8px 16px;font-size:14px;font-weight:500;line-height:20px;color:#fff;white-space:nowrap}
.seatdot{position:absolute;width:17px;height:17px;top:575px}
.seatdot .circle{width:17px;height:17px;border-radius:50%;background:var(--green)}
.seatdot b{position:absolute;left:2px;top:4px;font-size:6px;color:#fff;font-weight:700;line-height:normal}
.maphint{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--border-secondary);border-radius:var(--r-md);padding:10px 14px;font-size:12px;color:var(--text-tertiary)}

/* ============ Ticketshop ============ */
.chiprow{background:var(--bg-elevated);display:flex;align-items:center;position:sticky;top:0;z-index:6}
.chiprow.stuck{box-shadow:0 1px 0 var(--border)}
.chips{background:var(--bg-elevated);display:flex;gap:12px;align-items:center;padding:24px;flex-wrap:nowrap;flex:1;overflow-x:auto;overflow-y:visible;scrollbar-width:none;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chipmore{width:33px;height:33px;margin-right:24px;border:1px solid var(--border-secondary);border-radius:var(--r-md);background:var(--bg-elevated);align-items:center;justify-content:center;flex:none;cursor:pointer;display:none}
.chipmore.show{display:flex}
.chips.menuopen{overflow:visible}
.chip.open,.chip.active{border-color:var(--text-primary)}
.chipmenu{position:absolute;top:44px;left:0;min-width:160px;background:var(--bg-elevated);border:1px solid var(--border-secondary);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:10;overflow:hidden}
.chipmenu button{display:block;width:100%;text-align:left;background:var(--bg-elevated);border:0;padding:10px 12px;font-size:14px;cursor:pointer}
.chipmenu button:hover{background:var(--bg-fill)}
.chipmenu button.sel{font-weight:700}
.chip{position:relative;border:1px solid var(--border);border-radius:9999px;padding:8px 12px;font-size:14px;color:var(--text-primary);white-space:nowrap;background:var(--bg-elevated);cursor:pointer;display:inline-flex;align-items:center;gap:10px;flex:none}
.chip.sec{border-color:var(--border-secondary)}
.chip:hover{border-color:#bdbdbd}

.countdown{background:var(--bg-label)}
.countdown h3{margin:0;padding:24px 24px 0;font-size:18px;font-weight:700;color:var(--text-secondary)}
.countdown .tiles{display:flex;gap:12px;padding:12px 24px 24px}
.tile{flex:1;background:var(--bg-darklabel);border-radius:8px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff}
.tile b{font-size:18px;letter-spacing:-.45px;font-variant-numeric:tabular-nums;line-height:1}
.tile span{font-size:12px;line-height:1}

.infobar{background:var(--bg-darklabel);display:flex;gap:12px;align-items:center;justify-content:center;padding:24px 16px}
.infobar p{margin:0;font-size:16px;color:#fff;text-align:center}

.series{background:var(--bg-elevated);padding:24px 24px 0;font-size:18px;font-weight:700;color:var(--text-secondary)}
.evhead{background:var(--bg-elevated);display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:24px 24px 8px}
.evhead .t{font-size:18px;font-weight:700;color:var(--text-secondary);line-height:1.15}
.evhead .s{font-size:12px;color:var(--text-tertiary);margin-top:8px;line-height:1.1}
.evhead .right{text-align:right}
.venue{background:var(--bg-elevated);padding:0 24px 24px;font-size:12px;color:var(--text-tertiary)}
.descwrap{position:relative;background:var(--bg-elevated);height:55px;overflow:hidden;flex:none}
.descwrap p{margin:0;padding:12px 24px 24px;font-size:12px;line-height:1.35;color:var(--text-secondary)}
.descwrap .fade{position:absolute;left:0;right:0;bottom:0;height:55px;background:linear-gradient(1deg,#1f1f1f 20.87%,rgba(31,31,31,0) 92.22%)}
.more{background:var(--bg-elevated);padding:12px 24px 24px}
.more a{font-size:16px;color:var(--text-secondary);text-decoration:underline;cursor:pointer}

.empty{background:var(--bg-elevated);flex:1;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px 80px;text-align:center}
.empty p{margin:0;font-size:18px;font-weight:700;width:345px;max-width:100%;line-height:1.2}
.empty .mark{width:48.235px;height:41px;display:flex;align-items:center;justify-content:center}
.ticketanim{width:100%;height:100%;overflow:visible}
.ticketanim .trace{fill:none;stroke:#3d3d3d;stroke-width:9;stroke-miterlimit:10;stroke-dasharray:788 790;stroke-dashoffset:789;animation:draw_0 3200ms infinite,fadeStroke 3200ms infinite}
.ticketanim .draw{fill:none;stroke:#624de0;stroke-width:9;stroke-miterlimit:10;stroke-dasharray:788 790;stroke-dashoffset:789;animation:draw_1 3200ms infinite,fadeStroke 3200ms infinite}
@keyframes fadeStroke{0%{stroke-opacity:1}80%{stroke-opacity:1}100%{stroke-opacity:0}}
@keyframes draw_0{9.375%{stroke-dashoffset:789}39.375%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes draw_1{35.625%{stroke-dashoffset:789}65.625%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}

.footerblock{background:var(--bg-elevated);display:flex;justify-content:center;gap:20px;padding:12px 24px 24px;flex:none;position:sticky;bottom:0;z-index:4}
.footerblock.tight{padding:0 24px;bottom:76px}
.btn{height:40px;border-radius:var(--r-md);border:0;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:8px 16px}
.btn.primary{background:#ffe600;color:#000}
.btn.primary:hover{background:#f2d900}
.btn.secondary{background:var(--bg-elevated);border:1px solid var(--border-secondary);color:var(--text-primary);box-shadow:var(--shadow)}
.btn.ghost{background:var(--bg-elevated);border:1px solid var(--border-secondary);color:var(--text-primary)}
.btn.lg{height:44px;padding:8px 32px;flex:none}
.btn:disabled{background:var(--bg-fill);color:var(--text-tertiary);border:1px solid var(--border-secondary);box-shadow:none;cursor:default}

.sechead{background:var(--bg-elevated);display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px}
.sechead .h{font-size:18px;font-weight:700}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--green);border-radius:176px;padding:4px 8px}
.tag span{font-size:12px;color:#fafafa;white-space:nowrap}
.cathead{background:var(--bg-fill);display:flex;align-items:center;gap:12px;padding:12px 24px}
.cathead .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.cathead b{font-size:16px;color:var(--text-secondary)}
.seatrow{background:var(--bg-elevated);display:flex;padding:24px;border:0;width:100%;text-align:left;cursor:pointer}
.seatrow:hover{background:var(--bg-fill)}
.seatrow .inner{display:flex;justify-content:space-between;align-items:flex-start;width:100%;gap:16px}
.seatrow .l b{display:block;font-size:16px;color:var(--text-secondary)}
.seatrow .l span{display:block;font-size:12px;color:var(--text-tertiary);margin-top:4px}
.seatrow .l .catlabel{margin-top:12px}
.seatrow .r{max-width:186px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.seatrow .r b{font-size:16px;color:var(--text-secondary)}
.seatrow .r span.sub{font-size:12px;color:var(--text-tertiary);text-align:right}
.seatrow .r .tag{margin-top:12px}
.seatrow.locked{opacity:.55;cursor:not-allowed}
.cathead .cattag{margin-left:auto}

/* Detailseite */
.hero{background:var(--bg-elevated);padding:24px;display:flex;align-items:center;justify-content:center}

.pic{width:507px;max-width:100%;height:200px;background:var(--neutrals-5) var(--hero-img) center/cover no-repeat;border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.iconbtn{width:36px;height:36px;background:var(--bg-elevated);border:1px solid var(--border-secondary);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer}
.abouthead{background:var(--bg-elevated);padding:12px 24px 0;font-size:16px;font-weight:700;color:var(--text-secondary)}
.abouttext{background:var(--bg-elevated);padding:12px 24px 24px;font-size:14px;line-height:1.45;color:var(--text-secondary)}
.infoblock{background:var(--bg-elevated);border-top:1px dashed var(--border-secondary);border-bottom:1px dashed var(--border-secondary);padding:24px;display:flex;flex-direction:column;gap:20px}
.infoblock.venueblock{gap:4px}
.infoitem{display:flex;flex-direction:column;gap:4px}
.infoitem .k{font-size:14px;color:var(--text-tertiary)}
.infoitem b{font-size:16px;font-weight:700;color:var(--text-secondary)}
.infoitem .t{font-size:12px;color:var(--text-tertiary)}
.badgerow{background:var(--bg-elevated);padding:12px 24px;display:flex;gap:4px;align-items:center}
.platzhead{background:var(--bg-elevated);display:flex;align-items:center;gap:4px;padding:24px 0 12px 24px}
.platzhead p{margin:0;font-size:14px;color:var(--text-tertiary)}
.cardwrap{background:var(--bg-elevated);padding:12px 24px}
.cardwrap.last{padding:12px 24px 24px}
.tcard{border:1px solid var(--border-secondary);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--bg-elevated);transition:opacity .2s,transform .2s}
.tcard.removed{opacity:0;transform:translateY(-6px)}
.tcard .top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.tcard .top b{font-size:16px;color:var(--text-secondary)}
.tcard .top .del{background:none;border:0;cursor:pointer;padding:0}
.tcard .pill{align-self:stretch;justify-content:space-between;border:1px solid var(--border-secondary);border-radius:var(--r-lg);padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--bg-elevated);position:relative}
.tcard .pill span{font-size:14px;color:var(--text-primary)}
.tcard .hint{font-size:12px;color:var(--text-tertiary);line-height:1.25}
.pricemenu{position:absolute;top:44px;left:0;min-width:200px;background:var(--bg-elevated);border:1px solid var(--border-secondary);border-radius:var(--r-lg);box-shadow:var(--shadow);z-index:5;overflow:hidden}
.pricemenu button{display:block;width:100%;text-align:left;background:var(--bg-elevated);border:0;padding:10px 12px;font-size:14px;cursor:pointer}
.pricemenu button:hover{background:var(--bg-fill)}
.simhead{background:var(--bg-elevated);padding:24px 24px 0;font-size:16px;font-weight:700;color:var(--text-secondary)}
.simcards{background:var(--bg-elevated);display:flex;gap:28px;align-items:center;padding:24px;flex-wrap:wrap}
.simcard{width:151px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.simcard .img{height:117px;border-radius:8px;background:var(--neutrals-5) center/cover no-repeat}
.simcard b{font-size:16px;color:var(--text-secondary)}
.simcard span{font-size:14px;color:var(--text-tertiary)}
/* Zusammenfassung + Warenkorb bleiben beim Scrollen unten stehen */
.checkout{position:sticky;bottom:0;z-index:5;background:var(--bg-elevated);margin-top:auto}
.checkout .footerblock{position:static}
.summary{background:var(--bg-elevated);border-top:1px solid var(--border-secondary);display:flex;justify-content:space-between;padding:24px}
.summary .k{font-size:12px;color:var(--text-tertiary)}
.summary .v{font-size:18px;font-weight:700;color:var(--text-secondary);margin-top:4px}
.fine{background:var(--bg-elevated);padding:0 24px 24px;text-align:center;font-size:12px;color:var(--text-tertiary)}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-elevated);border-radius:var(--r-lg);width:629px;max-width:100%;overflow:hidden;box-shadow:0 12px 42px -4px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:24px}
body.mobile .modal{width:390px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 0;gap:12px}
.mhead h4{margin:0 auto;font-size:16px;font-weight:700;text-align:center}
.mhead .x{width:40px;height:36px;border:1px solid var(--border-secondary);border-radius:var(--r-md);background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mbody{padding:0 24px;display:flex;flex-direction:column;gap:24px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px}
.field input{height:40px;border:1px solid var(--border-secondary);border-radius:var(--r-md);background:var(--bg-fill);padding:8px 12px;font-size:14px;font-family:inherit}
.field input::placeholder{color:var(--text-tertiary)}
.field input.error{border-color:#d4380d}
.errmsg{font-size:12px;color:#d4380d}
.legal{font-size:12px;color:var(--text-tertiary);line-height:1.35;margin:0}
.legal a{color:#1677ff;text-decoration:none;cursor:pointer}
.mfoot{background:var(--bg-fill);border-top:1px solid var(--border-secondary);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:16px 24px}
body.mobile .mfoot{flex-direction:column-reverse;background:var(--bg-elevated)}
body.mobile .mfoot .btn{width:100%;flex:none;height:40px;font-size:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--bg-darklabel);color:#fff;padding:14px 20px;border-radius:8px;font-size:14px;z-index:80;animation:fadein .2s ease}

/* Annotationen */
.anno{display:none;margin:0 24px 12px;border-left:3px solid #7d6cf0;background:#2a2440;color:#d5cdff;font-size:12px;line-height:1.45;padding:10px 12px;border-radius:0 6px 6px 0}
body.anno-on .anno{display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}

/* Aktionscode-Leiste (Frame 1000001917) */
.codebar{background:var(--bg-label);display:flex;gap:12px;align-items:center;justify-content:center;padding:24px 16px;cursor:text}
.codebar .txt{font-size:14px;color:var(--text-primary)}
.codebar .txt b{font-weight:700}
.codebar input{border:0;background:transparent;font-family:inherit;font-size:14px;color:var(--text-primary);outline:none;width:180px}
.codebar input::placeholder{color:var(--text-primary)}
.codebar .rm{background:none;border:0;cursor:pointer;padding:0;display:flex}
.codeerror{background:#ff4d4f;display:flex;align-items:center;justify-content:center;padding:4px}
.codeerror p{margin:0;font-size:12px;color:#fff}

function ic(key, fbKey, size){
  let svg = FB[key] || FB[fbKey] || '';
  if(!svg) return '';
  if(size) svg = svg.replace(/width="[\d.]+" height="[\d.]+"/, `width="${size}" height="${size}"`);
  return svg.replace('<svg ', '<svg class="ic" ');
}

function mapSvg(){
  return `<img class="mapsvg" src="${MAP_IMG}" alt="Saalplan Tivoli">`;
}

function map(){
  const zoom = `<div class="zoom">
      <button data-zoom="-1">${ic('zoomOut',null,24)}</button>
      <button data-zoom="1">${ic('zoomIn',null,24)}</button>
    </div>`;
  const locked = S.phase !== 'running' && S.phase !== 'detail';
  const marks = !locked ? `
      <div class="tooltip"><span>370,00 €</span></div>
      <div class="seatdot" style="left:224px"><div class="circle"></div><b>22</b></div>
      <div class="seatdot" style="left:245px"><div class="circle"></div><b>23</b></div>` : '';
  return zoom + `
    <div class="canvas">
      <div class="mapshot ${locked?'locked':''}" style="transform:scale(${S.zoom})">
        ${mapSvg()}
        ${marks}
      </div>
    </div>`;
}

function fitMap(){
  const box = document.querySelector('.map');
  const el = document.querySelector('.mapshot');
  if(!box || !el) return;
  if(!S.zoomSet){
    const z = Math.min((box.clientWidth - 24) / 905, (box.clientHeight - 24) / 750);
    S.zoom = Math.min(1, Math.max(.4, Math.round(z * 100) / 100));
  }
  el.style.transform = `scale(${S.zoom})`;
}

function render(){
  document.body.classList.toggle('mobile', S.mobile);
  document.body.classList.toggle('anno-on', S.anno);
  const p = `<div class="panel" id="panel" style="width:${S.mobile?'100%':S.panelW+'px'}">${panel()}</div>`;
  const sl = `<div class="slider"><i></i></div>`;
  const m = `<div class="map"${S.mobile && S.mapH ? ` style="height:${S.mapH}px"` : ''}>${map()}</div>`;
  document.getElementById('app').innerHTML = S.mobile ? m + sl + p : p + sl + m;
  if(S.codeOpen && !S.code) document.getElementById('codeInput')?.focus();
  checkChipOverflow();
  fitMap();
  renderModal();
}

function renderModal(){
  const layer = document.getElementById('layer');
  if(!S.modal){ layer.innerHTML=''; return; }

  if(S.modal === 'notify'){
    layer.innerHTML = `
    <div class="overlay" data-close>
      <div class="modal">
        <div class="mhead"><span style="width:40px"></span><h4>Event Benachrichtigung</h4>
          <button class="x" data-close>${ic('close',null,16)}</button></div>
        <div class="mbody">
          <div class="field"><label for="mail">E-Mail</label>
            <input id="mail" type="email" placeholder="E-Mail eingeben" autocomplete="email"></div>
          <p class="legal">Mit dem Klick auf “Benachrichtigt werden” bestätigst Du, dass Du die <a>Datenschutzerklärung</a> gelesen und akzeptiert hast.</p>
        </div>
        <div class="mfoot">
          <button class="btn ghost lg" data-close>Abbrechen</button>
          <button class="btn primary lg" data-close>Benachrichtigt werden</button>
        </div>
      </div>
    </div>`;
    setTimeout(()=>document.getElementById('mail')?.focus(),40);
  }
}

function checkChipOverflow(){
  const row = document.querySelector('.chips');
  const more = document.getElementById('chipMore');
  if(!row || !more) return;
  const overflow = row.scrollWidth - row.clientWidth > 1;
  more.classList.toggle('show', overflow);
}

/* ── Interaktion ── */
document.addEventListener('click', e => {
  const t = e.target;

  if(t.closest('[data-close]')){ S.modal=null; return renderModal(); }

  const sel = t.closest('[data-select]');
  if(sel){
    S.cat = sel.dataset.select;
    const c = CATEGORIES.find(x=>x.id===S.cat) || CATEGORIES[0];
    S.seats = S.seats.slice(0, S.tickets);
    while(S.seats.length < S.tickets){
      S.seats.push({id:Date.now()+S.seats.length, cat:c.id, vvOnly:c.vvOnly,
        label:seatLabel(c, S.seats.length), ...PRICES[0]});
    }
    S.seats.forEach(s=>{ s.cat=c.id; s.vvOnly=c.vvOnly; });
    S.phase='detail';
    return render();
  }

  const chip = t.closest('[data-chip]');
  if(chip){ const k = chip.dataset.chip; S.openChip = S.openChip===k ? null : k; return render(); }

  const cnt = t.closest('[data-count]');
  if(cnt){ S.tickets = Number(cnt.dataset.count); S.openChip = null; return render(); }

  const cf = t.closest('[data-catfilter]');
  if(cf){ S.catFilter = S.catFilter===cf.dataset.catfilter ? null : cf.dataset.catfilter; S.openChip = null; return render(); }

  if(S.openChip && !t.closest('.chipmenu')){ S.openChip = null; render(); }

  const codeToggle = t.closest('[data-code-open]');
  if(codeToggle){
    if(codeToggle.classList.contains('codebar')) return;   // Klick ins Feld schließt nicht
    S.codeOpen = !S.codeOpen; S.codeError = false; return render();
  }
  if(t.closest('[data-code-remove]')){ S.code=null; S.codeOpen=false; S.codeError=false; return render(); }

  const open = t.closest('[data-open]');
  if(open){
    if(open.dataset.cat) S.cat = open.dataset.cat;
    S.modal = open.dataset.open; return renderModal();
  }

  const po = t.closest('[data-price-open]');
  if(po){ const id = Number(po.dataset.priceOpen); S.openPrice = S.openPrice===id ? null : id; return render(); }

  const pick = t.closest('[data-price]');
  if(pick){
    const [id,i] = pick.dataset.price.split('|');
    Object.assign(S.seats.find(s=>String(s.id)===id), PRICES[Number(i)]);
    S.openPrice = null; return render();
  }

  const del = t.closest('[data-del]');
  if(del){
    S.seats = S.seats.filter(s=>String(s.id)!==del.dataset.del);
    S.tickets = Math.max(1, S.seats.length);
    return render();
  }

  if(t.closest('[data-event-info]')){ S.back = S.phase; S.phase='event'; return render(); }

  if(t.closest('[data-back]')){ S.phase = S.phase==='event' ? S.back : 'running'; return render(); }

  if(t.closest('[data-cart]')){
    if(S.seats.some(s=>s.vvOnly) && !eligible()){
      S.seats = S.seats.filter(s=>!s.vvOnly);
      return render();
    }
    return;
  }

  if(t.closest('[data-chip-scroll]')){
    const row = document.querySelector('.chips');
    if(row) row.scrollLeft += row.clientWidth * 0.6;
    return;
  }

  const z = t.closest('[data-zoom]');
  if(z){
    S.zoomSet = true;
    S.zoom = Math.min(2, Math.max(.4, S.zoom + Number(z.dataset.zoom)*0.2));
    const el = document.querySelector('.mapshot');
    if(el) el.style.transform = `scale(${S.zoom})`;
    return;
  }

  if(S.openPrice !== null && !t.closest('.pricemenu')){ S.openPrice = null; render(); }
});

/* Slider: Panelbreite bzw. Kartenhöhe ziehen */
document.addEventListener('pointerdown', e => {
  const handle = e.target.closest('.slider');
  if(!handle) return;
  handle.classList.add('drag');
  handle.setPointerCapture(e.pointerId);
  const move = ev => {
    if(S.mobile){
      S.mapH = Math.min(window.innerHeight - 200, Math.max(160, ev.clientY - 8));
      const map = document.querySelector('.map');
      if(map) map.style.height = S.mapH + 'px';
      fitMap();
    } else {
      S.panelW = Math.min(window.innerWidth - 320, Math.max(390, ev.clientX));
      const panel = document.getElementById('panel');
      if(panel) panel.style.width = S.panelW + 'px';
      fitMap();
    }
  };
  const up = () => {
    handle.classList.remove('drag');
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    checkChipOverflow();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && S.modal){ S.modal=null; return renderModal(); }
  if(e.target.id === 'codeInput'){
    if(e.key === 'Enter'){
      const v = e.target.value.trim().toUpperCase();
      if(v === 'DIESDAS'){ S.code = v; S.codeOpen=false; S.codeError=false; }
      else { S.codeError = true; }
      render();
    }
    return;
  }
  if(e.target.tagName === 'INPUT') return;
  const m = {'1':'announce','2':'countdown','3':'signup','4':'running','5':'detail','6':'event'};
  if(m[e.key]){
    if(e.key === '2'){ presaleStart = Date.now() + 15000; switched = false; }
    S.phase = m[e.key]; return render();
  }
  if(e.key.toLowerCase() === 'm'){ S.mobile = !S.mobile; return render(); }
  if(e.key.toLowerCase() === 'a'){ S.anno = !S.anno; return render(); }
  if(e.key.toLowerCase() === 'r'){ location.reload(); }
});

/* Schatten unter den Filter-Pillen, sobald das Panel gescrollt ist */
document.addEventListener('scroll', e => {
  const panel = e.target.closest ? e.target.closest('.panel') : null;
  if(!panel) return;
  const row = panel.querySelector('.chiprow');
  if(row) row.classList.toggle('stuck', panel.scrollTop > 0);
}, true);

window.addEventListener('resize', () => {
  const mob = window.innerWidth < 760;
  if(mob !== S.mobile){ S.mobile = mob; render(); }
  else { checkChipOverflow(); fitMap(); }
});

setInterval(() => {
  if(S.phase === 'countdown'){
    const el = document.getElementById('countdown');
    if(el) el.outerHTML = countdownBlock();
    if(!switched && Date.now() >= presaleStart){ switched = true; S.phase='running'; S.codeOpen = false; S.codeError = false; render(); }
  }
}, 1000);

render();
</script>
